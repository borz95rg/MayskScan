name: Сборка Maysk Scan

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Библиотека OpenDocument.core требует Android API 36 для компиляции.
      # На новых образах runner (ubuntu-26.04) Android SDK не установлен — ставим сами, если sdkmanager не найден.
      - name: Установка Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1 && [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36"

      # Языки распознавания текста (работают без интернета, встраиваются в APK)
      - name: Языки распознавания
        run: |
          D=app/src/main/assets/tessdata
          mkdir -p $D
          for L in rus kaz eng ukr deu fra spa tur; do
            curl -fsSL --retry 3 -o $D/$L.traineddata \
              https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$L.traineddata
          done
          curl -fsSL --retry 3 -o $D/pdf.ttf https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/tessdata/pdf.ttf
          ls -la $D

      # Ключ подписи хранится только в секретах GitHub
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD не заданы — сборка подписана тестовым ключом и не будет опубликована."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/scan.keystore"
          echo "MAYSK_KEYSTORE=$RUNNER_TEMP/scan.keystore" >> "$GITHUB_ENV"
          echo "MAYSK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Сборка
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Удаление ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/scan.keystore"

      - name: Подготовка файла
        run: |
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk MayskScan.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk MayskScan-32bit.apk
          ls -la MayskScan*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MayskScan.apk
          path: MayskScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MayskScan-32bit.apk
          path: MayskScan-32bit.apk

      # Обновление для всех телефонов: APK кладём в GitHub Releases (лимит 2 ГБ на файл),
      # а в Supabase пишем только номер версии и ссылку на APK
      - name: Публикация обновления
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" != "1" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Публикация пропущена (нужны ключ подписи и SUPABASE_SERVICE_KEY)."
            exit 0
          fi
          URL=$(grep '^mayskscan.supabaseUrl=' gradle.properties | cut -d= -f2-)
          KEY="$SUPABASE_SERVICE_KEY"
          CODE=${{ github.run_number }}
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Maysk Scan (последняя версия)" --notes "Автоматическая сборка"
          gh release upload latest MayskScan.apk MayskScan-32bit.apk --clobber
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/MayskScan.apk"
          curl -sS --fail-with-body -X POST "$URL/rest/v1/app_settings?on_conflict=key" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "[{\"key\":\"scan_apk_url\",\"value\":\"$APK_URL\"},
                 {\"key\":\"scan_version_name\",\"value\":\"1.0.$CODE\"},
                 {\"key\":\"scan_version_code\",\"value\":\"$CODE\"}]"
          echo "Опубликовано: $APK_URL"
